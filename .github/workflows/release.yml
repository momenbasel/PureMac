name: Release Qpure

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag for this Qpure preview
        required: true
        type: string
        default: v3.0.0-zh.2

permissions:
  contents: write

concurrency:
  group: qpure-release
  cancel-in-progress: false

jobs:
  release:
    name: Test, build, and publish Qpure
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Run macOS tests
        run: |
          xcodebuild -project PureMac.xcodeproj \
            -scheme PureMac \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath build-tests \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            test

      - name: Build Apple Silicon app
        run: |
          xcodebuild -project PureMac.xcodeproj \
            -scheme PureMac \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath build-arm64 \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_IDENTITY='' \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Build Intel app
        run: |
          xcodebuild -project PureMac.xcodeproj \
            -scheme PureMac \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath build-x86_64 \
            ARCHS=x86_64 \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_IDENTITY='' \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package architecture-specific apps and checksums
        id: package
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          VERSION="${RELEASE_TAG#v}"
          ARM_APP='build-arm64/Build/Products/Release/Qpure.app'
          INTEL_APP='build-x86_64/Build/Products/Release/Qpure.app'
          ARM_BINARY="${ARM_APP}/Contents/MacOS/Qpure"
          INTEL_BINARY="${INTEL_APP}/Contents/MacOS/Qpure"
          ARM_ZIP="Qpure-macOS-Apple-Silicon-${VERSION}.zip"
          INTEL_ZIP="Qpure-macOS-Intel-${VERSION}.zip"
          test -d "${ARM_APP}"
          test -d "${INTEL_APP}"
          test "$(lipo -archs "${ARM_BINARY}")" = 'arm64'
          test "$(lipo -archs "${INTEL_BINARY}")" = 'x86_64'
          ditto -c -k --keepParent --sequesterRsrc "${ARM_APP}" "${ARM_ZIP}"
          ditto -c -k --keepParent --sequesterRsrc "${INTEL_APP}" "${INTEL_ZIP}"
          shasum -a 256 "${ARM_ZIP}" > "${ARM_ZIP}.sha256"
          shasum -a 256 "${INTEL_ZIP}" > "${INTEL_ZIP}.sha256"
          echo "arm_zip=${ARM_ZIP}" >> "$GITHUB_OUTPUT"
          echo "arm_checksum=${ARM_ZIP}.sha256" >> "$GITHUB_OUTPUT"
          echo "intel_zip=${INTEL_ZIP}" >> "$GITHUB_OUTPUT"
          echo "intel_checksum=${INTEL_ZIP}.sha256" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          ARM_ZIP: ${{ steps.package.outputs.arm_zip }}
          ARM_CHECKSUM: ${{ steps.package.outputs.arm_checksum }}
          INTEL_ZIP: ${{ steps.package.outputs.intel_zip }}
          INTEL_CHECKSUM: ${{ steps.package.outputs.intel_checksum }}
        run: |
          set -euo pipefail
          if gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "::error::A release already exists for ${RELEASE_TAG}. Choose a new tag."
            exit 1
          fi
          VERSION="${RELEASE_TAG#v}"
          cat > release-notes.md <<EOF
          ## Qpure ${VERSION} 中文化预览版

          基于 PureMac 的 Qpure fork，包含简体中文界面、繁体中文资源和重新设计的应用图标。

          - Apple Silicon（M 系列）：[${ARM_ZIP}](https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/${ARM_ZIP})（[SHA-256](https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/${ARM_CHECKSUM})）
          - Intel：[${INTEL_ZIP}](https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/${INTEL_ZIP})（[SHA-256](https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/${INTEL_CHECKSUM})）

          下载与你的 Mac 芯片对应的 ZIP，解压后将 Qpure.app 拖入“应用程序”文件夹。

          ### 安全说明

          此预览包未使用 Developer ID 签名或 Apple 公证。macOS 首次打开时可能显示安全提示；也可以从源码自行构建。
          EOF
          gh release create "${RELEASE_TAG}" \
            "${ARM_ZIP}" \
            "${ARM_CHECKSUM}" \
            "${INTEL_ZIP}" \
            "${INTEL_CHECKSUM}" \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --title "Qpure ${VERSION} 中文化预览版" \
            --prerelease \
            --notes-file release-notes.md
