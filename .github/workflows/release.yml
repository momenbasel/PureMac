name: Release Qpure

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag for this Qpure preview
        required: true
        type: string
        default: v3.0.0-zh.1

permissions:
  contents: write

concurrency:
  group: qpure-release
  cancel-in-progress: false

jobs:
  release:
    name: Test, build, and publish Qpure
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Run macOS tests
        run: |
          xcodebuild -project PureMac.xcodeproj \
            -scheme PureMac \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath build-tests \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            test

      - name: Build universal app
        run: |
          xcodebuild -project PureMac.xcodeproj \
            -scheme PureMac \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath build \
            ARCHS='arm64 x86_64' \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_IDENTITY='' \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package app and checksum
        id: package
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          APP='build/Build/Products/Release/Qpure.app'
          VERSION="${RELEASE_TAG#v}"
          ZIP="Qpure-macOS-universal-${VERSION}.zip"
          test -d "${APP}"
          ditto -c -k --keepParent --sequesterRsrc "${APP}" "${ZIP}"
          shasum -a 256 "${ZIP}" > "${ZIP}.sha256"
          echo "zip=${ZIP}" >> "$GITHUB_OUTPUT"
          echo "checksum=${ZIP}.sha256" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          ZIP: ${{ steps.package.outputs.zip }}
          CHECKSUM: ${{ steps.package.outputs.checksum }}
        run: |
          set -euo pipefail
          if gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "::error::A release already exists for ${RELEASE_TAG}. Choose a new tag."
            exit 1
          fi
          VERSION="${RELEASE_TAG#v}"
          cat > release-notes.md <<EOF
          ## Qpure ${VERSION} 中文化预览版

          基于 PureMac 的 Qpure fork，包含简体中文界面、繁体中文资源和重新设计的应用图标。

          下载 `${ZIP}`，解压后将 Qpure.app 拖入“应用程序”文件夹。

          **安全说明：**此预览包未使用 Developer ID 签名或 Apple 公证。macOS 首次打开时可能显示安全提示；也可以从源码自行构建。
          EOF
          gh release create "${RELEASE_TAG}" \
            "${ZIP}" \
            "${CHECKSUM}" \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --title "Qpure ${VERSION} 中文化预览版" \
            --prerelease \
            --notes-file release-notes.md
